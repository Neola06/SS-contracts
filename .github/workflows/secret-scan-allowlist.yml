name: Secret Scanning Allowlist Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-allowlist:
    name: Validate Secret Scanning Allowlist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yq
        uses: mikefarah/yq@v4.43.1

      - name: Validate allowlist entries
        run: |
          bash scripts/secret-scan-allowlist.sh check .github/secret-scan-allowlist.yml

      - name: Summarize allowlist (on failure)
        if: failure()
        run: |
          bash scripts/secret-scan-allowlist.sh summarize .github/secret-scan-allowlist.yml

      - name: Add allowlist summary to workflow run
        if: always() && hashFiles('.github/secret-scan-allowlist.yml') != ''
        run: |
          {
            echo '### Secret Scanning Allowlist Validation'
            echo
            bash scripts/secret-scan-allowlist.sh summarize .github/secret-scan-allowlist.yml
          } >> "$GITHUB_STEP_SUMMARY"
